        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: docId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyKycDocumentBody"
      responses:
        "200":
          description: Updated doc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycDocument"

  /advisor/clients/{id}/tasks:
    get:
      operationId: advisorGetClientTasks
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdvisorTask"

