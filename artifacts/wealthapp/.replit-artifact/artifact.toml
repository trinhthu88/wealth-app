kind = "web"
previewPath = "/"
title = "WealthApp"
version = "1.0.0"
id = "artifacts/wealthapp"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24415

[services.development]
run = "pnpm --filter @workspace/wealthapp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wealthapp", "run", "build" ]
publicDir = "artifacts/wealthapp/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24415"
BASE_PATH = "/"
